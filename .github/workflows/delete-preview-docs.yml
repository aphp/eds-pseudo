name: Delete preview docs

on:
  workflow_dispatch:
  delete:

jobs:
  delete:
    # Deleting a branch deletes the Vercel project of its docs preview, made by the documentation job of tests.yml
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.event.ref }}
    steps:
      - run: |
          set -euo pipefail
          # ie, the same preview name as in tests.yml
          preview_name=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//; s/-+/-/g' | cut -c1-80)
          npm install --global vercel@latest
          vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
          vercel remove eds-pseudo-${preview_name:-preview} --yes --token=${{ secrets.VERCEL_TOKEN }}
